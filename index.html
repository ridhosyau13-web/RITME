<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ritme — tracker pribadi</title><meta name="theme-color" content="#00aa13"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ritme"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%9F%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=Figtree:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f3;--c:#fff;--ink:#101828;--m:#667085;--ln:#e1e6ef;--g:#059669;--y:#d97706;--r:#dc2626;--a:#00aa13;--a2:#27d17a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:inherit}
body{margin:0;background:radial-gradient(color-mix(in srgb,var(--a) 16%,transparent) 1.3px,transparent 1.8px) 0 0/22px 22px,color-mix(in srgb,var(--a) 9%,#f8faf8);color:var(--ink);font:400 14px/1.5 Figtree,system-ui,sans-serif}
#app{max-width:480px;margin:auto;padding:14px 16px 104px}
h1,h2,b.n{font-family:'Bricolage Grotesque',system-ui,sans-serif}
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.2px}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:22px 20px;color:#fff;background:var(--pt,none),linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 14px 28px -16px var(--a)}.ph{--pt:radial-gradient(circle at 88% 12%,#fff4 0 34px,transparent 35px),radial-gradient(circle at 62% 120%,#fff3 0 70px,transparent 71px),radial-gradient(#fff4 1.6px,transparent 2px) 0 0/18px 18px}.pl{--pt:repeating-linear-gradient(115deg,#fff0 0 14px,#fff2 14px 22px)}.pu{--pt:radial-gradient(circle,#fff0 0 7px,#fff3 8px 10px,#fff0 11px) 0 0/30px 30px}
.hero h1{font-size:30px;line-height:1.05;margin:0 0 6px;letter-spacing:-1px;font-weight:800}
.hero p{margin:0;opacity:.9;max-width:78%}
.hero .ic{position:absolute;right:-14px;bottom:-18px;width:130px;height:130px;opacity:.22;stroke-width:1.2}
.card{background:#fff;border:1px solid color-mix(in srgb,var(--a) 12%,#e6ebe6);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 10px 22px -16px color-mix(in srgb,var(--a) 70%,transparent)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.f1{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.st{background:color-mix(in srgb,var(--a) 13%,#fff);border:0;border-radius:20px;padding:13px}.g2 .st:nth-child(2){background:color-mix(in srgb,var(--a2) 16%,#fff)}
.st b{display:block;font-size:23px;line-height:1.1;font-weight:800}.st span,.sub{font-size:12.5px;color:var(--m)}
.ic{width:22px;height:22px;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -10px 28px -14px #0005}
nav button{flex:1;max-width:150px;border:0;background:none;color:var(--m);font:700 12px Figtree;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px;border-radius:16px}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--a),var(--a2))}
input,select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px;margin:4px 0}
textarea{width:100%;height:80px;font:12px monospace;color:inherit;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:8px}
.p{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border:0;border-radius:16px;padding:12px;font:700 14px Figtree;width:100%;margin-top:6px;box-shadow:0 8px 16px -8px var(--a)}
.chip{border:1px solid var(--ln);background:none;color:var(--m);border-radius:99px;padding:5px 12px;font:600 12.5px Figtree}
.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
summary{font-weight:700;cursor:pointer}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;border-radius:9px}
.tag{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px}
.x{border:0;background:none;color:var(--m);font-size:20px;padding:0 4px}
.ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--ln);background:none;color:#fff;flex:none;padding:0;display:grid;place-items:center}
.ck.on{background:var(--g);border-color:var(--g)}
.day{flex:1;border:0;border-radius:14px;padding:8px 0;background:var(--c);color:var(--ink);font:600 12px Figtree;border:1px solid var(--ln)}
.day b{display:block;font-size:17px}.day.on{background:var(--a);color:#fff;border-color:var(--a)}
.q{font:italic 19px/1.4 'Instrument Serif',Georgia,serif}
.tip{border-radius:20px;padding:14px 16px;margin:12px 0;background:color-mix(in srgb,var(--a2) 13%,#fff);border-left:6px solid var(--a2)}
.tip b{display:block;margin-bottom:2px}
</style></head><body><div id="app"></div><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),K='ritme-v1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{tasks:[],runs:[],shoes:[{id:1,name:'Sepatu utama',lim:600}],tx:[],goal:20};
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addD=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return iso(x)};
const wk=d=>addD(d,-((new Date(d+'T00:00').getDay()+6)%7));
const TD=iso(new Date()),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
let tab='hari',sel=TD,fl='all',qi=Math.floor(Date.now()/864e5)%5;
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const pc=(km,m)=>{if(!km||!m)return'–';const t=Math.round(m/km*60);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={hari:'<path d="M8 2v4M16 2v4M3 9h18"/><rect x="3" y="4" width="18" height="17" rx="3"/><path d="m9 15 2 2 4-4"/>',
lari:'<path d="M2 17v-4l4-1 2.5 2H12l2-2.5 5 2c1.5.6 3 1.5 3 3.5v1.5H2z"/><path d="M2 20.5h20M9 12l1-2M12 11l1-2"/>',
uang:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 6V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2"/><circle cx="16.5" cy="13" r="1.3"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const TC={hari:['#00aa13','#27d17a'],lari:['#ff5a2c','#ff8f1f'],uang:['#2f6bff','#8b5cf6']};
const CAT={belajar:['Belajar','#2f6bff','📚'],harian:['Harian','#00a85a','☀️'],kegiatan:['Kegiatan','#ff5a8a','🎯']};
const tag=(t,c)=>`<span class="tag" style="background:color-mix(in srgb,${c} 15%,transparent);color:${c}">${t}</span>`;
const tip=(t,b)=>`<div class="tip"><b>${t}</b>${b}</div>`;
const go=t=>{tab=t;R();scrollTo(0,0)};
const del=(k,id)=>{S[k]=S[k].filter(a=>a.id!=id);sv();R()};
const addTask=()=>{const t=$('#tt').value.trim();if(!t)return;S.tasks.push({id:Date.now(),t,c:$('#tc').value,d:sel,h:$('#th').value,ok:0});sv();R()};
const tog=id=>{const x=S.tasks.find(a=>a.id==id);x.ok=!x.ok;sv();R()};
const addRun=()=>{const km=+$('#rk').value,m=(+$('#rm').value||0)+(+$('#rs').value||0)/60;if(!km||!m)return;S.runs.push({id:Date.now(),d:$('#rd').value||TD,km,m,sh:+$('#rsh').value});sv();R()};
const addShoe=()=>{const n=$('#sn').value.trim();if(!n)return;S.shoes.push({id:Date.now(),name:n,lim:+$('#sl').value||600});sv();R()};
const addTx=()=>{const a=+$('#xa').value;if(!a)return;const t=$('#xt').value;S.tx.push({id:Date.now(),d:TD,t,c:t=='in'?'Pemasukan':$('#xc').value,a,n:$('#xn').value});sv();R()};
const exp=()=>$('#bk').value=JSON.stringify(S);
const imp=()=>{try{const o=JSON.parse($('#bk').value);if(!o.tasks)throw 0;S=o;sv();R()}catch(x){$('#bk').value='Format cadangan tidak valid. Tempel hasil ekspor di sini.'}};
const pal=['#059669','#0ea5a4','#2563eb','#7c3aed','#e11d5a','#f97316','#eab308'];
const line=(v,w=300,h=90)=>{if(v.length<2)return'<div class="sub">Butuh minimal 2 data untuk menampilkan grafik.</div>';const mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1,P=v.map((y,i)=>[8+i*(w-16)/(v.length-1),8+(1-(y-mn)/r)*(h-16)]),d=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');return `<svg viewBox="0 0 ${w} ${h}" width="100%"><path d="${d}L${P[P.length-1][0]} ${h}L8 ${h}Z" fill="var(--a)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--a)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--c)" stroke="var(--a)" stroke-width="2"/>`).join('')}</svg>`};
const donut=it=>{const t=sum(it,x=>x[1])||1,C=251.3;let o=0;return `<div class="row"><svg width="110" height="110" viewBox="0 0 110 110">${it.map(x=>{const l=x[1]/t*C,s=`<circle cx="55" cy="55" r="40" fill="none" stroke="${x[2]}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 55 55)"/>`;o+=l;return s}).join('')}</svg><div class="f1">${it.map(x=>`<div class="row sub"><i style="width:10px;height:10px;border-radius:3px;background:${x[2]}"></i><span class="f1">${x[0]}</span><b>${Math.round(x[1]/t*100)}%</b></div>`).join('')}</div></div>`};
const hv=days=>{const dn=['Sen','Sel','Rab','Kam','Jum','Sab','Min'],st=days.map(d=>S.tasks.filter(t=>t.d==d)),mx=Math.max(1,...st.map(a=>a.length)),ct=Object.entries(CAT).map(([k,v])=>[v[0],sum(st,a=>a.filter(t=>t.c==k).length),v[1]]).filter(x=>x[1]);return `<div class="card"><h2>Progres minggu ini</h2><div class="row" style="align-items:flex-end;height:100px">${st.map((a,i)=>{const k=a.filter(t=>t.ok).length;return `<div class="f1" style="text-align:center"><div class="sub">${a.length?k+'/'+a.length:''}</div><div style="height:${a.length/mx*60}px;min-height:4px;border-radius:9px;background:var(--ln);display:flex;align-items:flex-end;overflow:hidden"><div style="width:100%;height:${a.length?k/a.length*100:0}%;background:var(--g)"></div></div><div class="sub">${dn[i]}</div></div>`}).join('')}</div><div class="sub">Bagian hijau adalah kegiatan yang sudah selesai.</div></div>${ct.length?`<div class="card"><h2>Porsi kegiatan minggu ini</h2>${donut(ct)}</div>`:''}`};
const heat=()=>{const s=addD(wk(TD),-28);return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${[...Array(35)].map((_,i)=>{const d=addD(s,i),k=sum(S.runs.filter(r=>r.d==d),r=>r.km);return `<div title="${d}" style="aspect-ratio:1;border-radius:7px;background:${k?`color-mix(in srgb,var(--a) ${Math.min(30+k*8,100)}%,transparent)`:'var(--ln)'};${d>TD?'opacity:.3':''}"></div>`}).join('')}</div>`};
const lv=()=>{const r=S.runs.slice().sort((a,b)=>a.d.localeCompare(b.d)).slice(-10);return `<div class="card"><h2>Tren pace (menit per km)</h2>${line(r.map(x=>x.m/x.km))}<div class="sub">Garis turun berarti kamu makin cepat.${r.length?' Terakhir '+pc(r[r.length-1].km,r[r.length-1].m)+' /km.':''}</div></div><div class="card"><h2>Konsistensi 5 minggu</h2>${heat()}<div class="sub">Satu kotak satu hari, makin pekat makin jauh.</div></div>`};
const uv=()=>{const nm=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],ms=[5,4,3,2,1,0].map(i=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);return iso(d).slice(0,7)}),dt=ms.map(m=>{const t=S.tx.filter(x=>x.d.slice(0,7)==m);return[nm[+m.slice(5)-1],sum(t.filter(x=>x.t=='in'),x=>x.a),sum(t.filter(x=>x.t=='out'),x=>x.a)]}),mx=Math.max(1,...dt.map(a=>Math.max(a[1],a[2]))),bal=[];let b=0;dt.forEach(a=>{b+=a[1]-a[2];bal.push(b)});return `<div class="card"><h2>Masuk vs keluar, 6 bulan</h2><div class="row" style="align-items:flex-end;gap:6px">${dt.map(a=>`<div class="f1" style="text-align:center"><div class="row" style="align-items:flex-end;height:90px;gap:3px"><div class="f1" style="height:${a[1]/mx*90}px;min-height:3px;background:var(--g);border-radius:6px 6px 2px 2px"></div><div class="f1" style="height:${a[2]/mx*90}px;min-height:3px;background:var(--r);border-radius:6px 6px 2px 2px"></div></div><div class="sub">${a[0]}</div></div>`).join('')}</div><div class="sub">Hijau masuk, merah keluar.</div></div><div class="card"><h2>Saldo kumulatif</h2>${line(bal)}<div class="sub">Garis naik berarti kamu menabung bersih.</div></div>`};
const V={};
V.hari=()=>{
const h=new Date().getHours(),g=h<11?'pagi':h<15?'siang':h<18?'sore':'malam',ws=wk(sel),dn=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
const days=[...Array(7)].map((_,i)=>addD(ws,i)),all=S.tasks.filter(t=>t.d==sel),dn_=all.filter(t=>t.ok).length,p=all.length?dn_/all.length:0;
const ls=all.filter(t=>fl=='all'||t.c==fl).sort((a,b)=>(a.h||'99').localeCompare(b.h||'99'));
const ran=sum(S.runs.filter(r=>r.d==TD),r=>r.km);
const ml=h<10?['Sarapan','Oatmeal dengan pisang dan telur rebus, atau nasi uduk porsi kecil dengan telur dan sayur.']:h<15?['Makan siang','Nasi secukupnya, ikan atau ayam panggang, tempe, dan sayur sebanyak separuh piring.']:h<18?['Camilan sore','Yogurt dengan buah, kacang rebus, atau sebuah pisang.']:['Makan malam','Porsi lebih ringan: sup, pepes ikan, tumis sayur, dan sedikit karbo.'];
return `<div class="hero ph"><div class="row sp"><div><h1>Selamat ${g} 👋</h1><p>${new Date(sel+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}</p></div>
<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#fff3" stroke-width="7"/><circle cx="32" cy="32" r="26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="${p*163.4} 163.4" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" fill="#fff" font-family="Bricolage Grotesque" font-weight="800" font-size="15">${Math.round(p*100)}%</text></svg></div>${ic('hari')}</div>
<div class="row" style="margin:12px 0">${days.map((d,i)=>`<button class="day ${d==sel?'on':''}" onclick="sel='${d}';R()">${dn[i]}<b class="n">${d.slice(8)}</b></button>`).join('')}</div>
<div class="row" style="gap:6px;flex-wrap:wrap">${[['all','Semua'],...Object.entries(CAT).map(([k,v])=>[k,v[0]])].map(([k,l])=>`<button class="chip ${fl==k?'on':''}" onclick="fl='${k}';R()">${l}</button>`).join('')}</div>
<div class="card">${ls.length?ls.map(t=>`<div class="row" style="padding:7px 0"><button class="ck ${t.ok?'on':''}" onclick="tog(${t.id})">${t.ok?'✓':''}</button><div class="f1" style="${t.ok?'opacity:.5;text-decoration:line-through':''}">${e(t.t)}<div class="sub">${t.h||'Sepanjang hari'}</div></div>${tag(CAT[t.c][2]+' '+CAT[t.c][0],CAT[t.c][1])}<button class="x" onclick="del('tasks',${t.id})">×</button></div>`).join(''):'<div class="sub">Belum ada kegiatan di tanggal ini. Tambahkan yang pertama di bawah.</div>'}</div>
<details class="card"><summary>Tambah kegiatan</summary><input id="tt" placeholder="Mis. Belajar Excel pivot 45 menit"><div class="row"><select id="tc"><option value="belajar">Belajar</option><option value="harian">Harian</option><option value="kegiatan">Kegiatan</option></select><input id="th" type="time"></div><button class="p" onclick="addTask()">Simpan kegiatan</button></details>
${hv(days)}${tip(ml[0],ml[1]+(ran?` Hari ini kamu sudah lari ${ran.toFixed(1)} km, jadi tambah protein (telur, tempe, dada ayam) dan minum air putih lebih banyak.`:''))}
<details class="card"><summary>Cadangan data</summary><p class="sub">Data tersimpan di HP ini. Salin hasil ekspor untuk jaga-jaga atau pindah perangkat.</p><textarea id="bk"></textarea><div class="row"><button class="p" onclick="exp()">Ekspor</button><button class="p" onclick="imp()">Impor</button></div></details>`};
V.lari=()=>{
const rs=S.runs.slice().sort((a,b)=>b.d.localeCompare(a.d)),tot=sum(S.runs,r=>r.km),tm=sum(S.runs,r=>r.m),w0=wk(TD),sw=w=>sum(S.runs.filter(r=>wk(r.d)==w),r=>r.km);
const wkm=sw(w0),lw=sw(addD(w0,-7)),wb=[5,4,3,2,1,0].map(i=>{const w=addD(w0,-7*i);return[w,sw(w)]}),mx=Math.max(...wb.map(a=>a[1]),S.goal,1);
const last=rs[0],lk=last?last.km:0;
const meal=!last?['Mulai dari satu lari','Catat lari pertamamu, lalu rekomendasi asupan menyesuaikan jaraknya.']:lk<5?['Pemulihan ringan','Minum 400–500 ml air, lalu camilan karbo dan protein seperti pisang dengan susu atau yogurt.']:lk<10?['Pemulihan standar','Dalam 30–60 menit makan karbo dan protein: nasi dengan telur atau ayam, ditambah buah. Jangan lupa air putih.']:['Pemulihan lari panjang','Ganti elektrolit (air kelapa atau minuman isotonik), makan lengkap dalam 1 jam, dan coba bawa pisang atau gel saat lari panjang berikutnya.'];
const load=lw>0&&wkm>lw*1.1?'Jarak minggu ini naik lebih dari 10% dari minggu lalu. Beri satu hari istirahat penuh supaya tubuh sempat beradaptasi.':'Naikkan jarak mingguan bertahap, sekitar 10% saja. Sebelum lari, 1–2 jam sebelumnya makan karbo ringan seperti roti atau pisang.';
return `<div class="hero pl"><h1>Lari 🏃</h1><p>${tot?`${tot.toFixed(1)} km total, rata-rata ${pc(tot,tm)} /km`:'Catat lari pertamamu dan pace dihitung otomatis.'}</p>${ic('lari')}</div>
<div class="g2"><div class="st"><span>Minggu ini</span><b class="n">${wkm.toFixed(1)} km</b><div class="bar"><i style="width:${Math.min(wkm/S.goal*100,100)}%;background:var(--a)"></i></div><span>target <input type="number" value="${S.goal}" onchange="S.goal=+this.value||20;sv();R()" style="width:60px;padding:2px 6px;margin:0"> km</span></div>
<div class="st"><span>Pace rata-rata</span><b class="n">${pc(tot,tm)}</b><span>${S.runs.length} lari tercatat</span><br><span>Terpanjang ${Math.max(0,...S.runs.map(r=>r.km)).toFixed(1)} km</span></div></div>
<div class="card"><h2>Jarak per minggu (km)</h2><div class="row" style="align-items:flex-end;height:120px">${wb.map(a=>`<div class="f1" style="text-align:center"><div class="sub">${a[1]?a[1].toFixed(0):''}</div><div style="height:${a[1]/mx*80}px;min-height:4px;background:linear-gradient(var(--a),var(--a2));border-radius:9px 9px 4px 4px"></div><div class="sub">${a[0].slice(8)}/${a[0].slice(5,7)}</div></div>`).join('')}</div></div>
${lv()}${tip(meal[0],meal[1])}${tip('Beban latihan',load)}
<details class="card"><summary>Catat lari</summary><input id="rd" type="date" value="${TD}"><input id="rk" type="number" step="0.01" placeholder="Jarak (km)"><div class="row"><input id="rm" type="number" placeholder="Menit"><input id="rs" type="number" placeholder="Detik"></div><select id="rsh">${S.shoes.map(s=>`<option value="${s.id}">${e(s.name)}</option>`).join('')}</select><button class="p" onclick="addRun()">Simpan lari</button></details>
